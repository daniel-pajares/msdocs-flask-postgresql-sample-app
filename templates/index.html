{% extends "base.html" %}
{% block title %}Procesamiento de imagenes{% endblock %}
{% block head %}
    {{ super() }}
    <style>
      body {
          min-height: 75rem;
          padding-top: 4.5rem;
      }

      .score {
        display: block;
        font-size: 16px;
        position: relative;
        overflow: hidden;
      }
      
      .score-wrap {
        display: inline-block;
        position: relative;
        height: 19px;
      }
      
      .score .stars-active {
        color: #EEBD01;
        position: relative;
        z-index: 10;
        display: inline-block;
        overflow: hidden;
        white-space: nowrap;
      }
      
      .score .stars-inactive {
        color: grey;
        position: absolute;
        top: 0;
        left: 0;
        -webkit-text-stroke: initial;
        /* overflow: hidden; */
      }
  </style>
{% endblock %}
{% block content %}
      <h1>Imagenes procesadas</h1>

      {% if True %}
          <table class="table">
              <thead>
                  <tr>
                      <th>Nombre</th>
                      <th class="text-end">Datos</th>
                  </tr>
              </thead>
              <tbody>
                  {% for image in images %}
                      <tr>
                          <td>{{ image.name }}</td>
                          <td class="text-end"><a href="{{ url_for('details', id=image.id) }}" class="btn btn-sm btn-primary">Datos</a></td>
                      </tr>
                  {% endfor %}
              </tbody>
          </table>
{% endblock %}
